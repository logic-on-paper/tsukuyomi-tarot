<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="78枚のタロットで占う、1枚引きと3枚引きのタロット占い">
<meta name="theme-color" content="#191022">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="タロット">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* 端末の切り欠きやホームバーを避けるための余白 */
html { padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>月読</title>
<style>
/* Layout: 夜の卓にカードを並べる1カラム（最大34rem）。上から、設定、カード、読み解き、カード一覧の順に積む */
:root {
  color-scheme: dark;
  --cloth: #15101b;
  --cloth-lift: #241b30;
  --cloth-deep: #0b080f;
  --rule: #3b3045;
  --ink: #ece2d0;
  --muted: #ab9fb8;
  --gilt: #d4b26a;
  --gilt-deep: #9d7a3a;
  --gilt-glow: rgba(212, 178, 106, 0.22);
  --verdigris: #7fc4b5;
  --paper: #f2e9d6;
  --card-ink: #2b1f3a;
  --card-ink-soft: #6b5c79;
  --back: #110c17;
  --shadow: rgba(8, 4, 14, 0.55);
  --font-display: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", "Noto Serif CJK JP", serif;
  --font-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", "Noto Sans CJK JP", sans-serif;
  --font-latin: "Cormorant Garamond", "Cochin", "Baskerville", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  height: 100%;
  background: var(--cloth-deep);
}
*, *::before, *::after { box-sizing: border-box; }
body {
  min-height: 100%;
  margin: 0;
  background:
    radial-gradient(90% 60% at 50% 30%, transparent 50%, rgba(0, 0, 0, 0.5) 100%) no-repeat,
    radial-gradient(120% 60% at 50% -10%, var(--cloth-lift), var(--cloth) 45%, var(--cloth-deep) 100%) no-repeat var(--cloth-deep);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.8;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
.wrap {
  max-width: 40rem;
  margin-inline: auto;
  padding-inline: 20px;
  padding-block: 28px 44px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* 見出し */
.mast { display: flex; flex-direction: column; gap: 8px; text-align: center; }
.eyebrow { margin: 0; font-family: var(--font-latin); font-size: 0.75rem; letter-spacing: 0.32em; color: var(--gilt); }
h1 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 2.6rem; line-height: 1.2; letter-spacing: 0.18em; text-indent: 0.18em; text-wrap: balance; color: var(--ink); text-shadow: 0 0 24px var(--gilt-glow); }
.mast-rule { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 0; font-family: var(--font-latin); font-size: 0.72rem; letter-spacing: 0.42em; text-indent: 0.42em; color: var(--gilt); }
.mast-rule::before, .mast-rule::after { content: ""; width: 56px; height: 1px; background: linear-gradient(90deg, transparent, var(--gilt-deep)); }
.mast-rule::after { background: linear-gradient(90deg, var(--gilt-deep), transparent); }
.lede { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; text-wrap: balance; }

/* 設定 */
.setup { display: flex; flex-direction: column; gap: 14px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--gilt-deep); border-radius: 999px; padding: 3px; position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: 7px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); font-size: 0.95rem; }
.seg input:checked + label { background: var(--gilt); color: var(--cloth-deep); font-weight: 600; }
.seg input:focus-visible + label { outline: 2px solid var(--ink); outline-offset: 2px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; }
.cat input { position: absolute; opacity: 0; pointer-events: none; }
.cat label { display: inline-block; padding: 5px 14px; border: 1px solid var(--gilt-deep); border-radius: 999px; font-size: 0.85rem; color: var(--muted); cursor: pointer; letter-spacing: 0.04em; }
.cat input:checked + label { background: var(--gilt); border-color: var(--gilt); color: var(--cloth-deep); font-weight: 600; }
.cat input:focus-visible + label { outline: 2px solid var(--ink); outline-offset: 2px; }
.field label { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; }
.field input {
  font: inherit; font-size: 1rem; color: var(--ink); background: transparent;
  border: 0; border-bottom: 1px solid var(--rule); border-radius: 0; padding: 6px 2px; width: 100%; min-width: 0;
}
.field input::placeholder { color: var(--card-ink-soft); }
.field input:focus-visible { outline: none; border-bottom-color: var(--gilt); }
.checks { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--gilt); }

/* カード */
.spread-area { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.spread { list-style: none; margin: 0; padding: 0; width: 100%; display: grid; gap: 14px; }
.spread.three { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 40rem; }
.spread.one { grid-template-columns: minmax(0, 1fr); max-width: 19rem; }
.slot { display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; animation: deal 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) backwards; }
.slot::before {
  content: ""; position: absolute; inset: -6% -28%; border-radius: 50%; pointer-events: none; z-index: 0;
  background: radial-gradient(closest-side, var(--gilt-glow), transparent 72%);
  opacity: 0.35; transition: opacity 1.2s ease;
}
.slot:has(.card.is-open)::before { opacity: 1; }
.slot > * { position: relative; z-index: 1; }
.slot:nth-child(2) { animation-delay: 0.12s; }
.slot:nth-child(3) { animation-delay: 0.24s; }
@keyframes deal { from { opacity: 0; transform: translateY(-18px) rotate(-4deg); } }
.pos { text-align: center; font-family: var(--font-display); font-size: 0.85rem; letter-spacing: 0.2em; color: var(--gilt); }
.card {
  display: block; width: 100%; max-width: 100%; aspect-ratio: 140 / 240; padding: 0; border: 0; background: none;
  cursor: pointer; perspective: 900px; border-radius: 6.5% / 3.8%;
}
.card:focus-visible { outline: 2px solid var(--gilt); outline-offset: 4px; }
.card.is-open { cursor: zoom-in; }
.zoom { border: 0; padding: 0; background: transparent; max-width: 100vw; max-height: 100vh; width: 100vw; height: 100vh; }
.zoom::backdrop { background: rgba(8, 4, 14, 0.92); }
.zoom-body { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; cursor: zoom-out; }
.zoom-body img, .zoom-body svg { max-width: 100%; max-height: 100%; width: auto; height: auto; aspect-ratio: 140 / 240; border-radius: 6.5% / 3.8%; box-shadow: 0 12px 40px rgba(0,0,0,0.7); }
.zoom.is-rev img, .zoom.is-rev svg { transform: rotate(180deg); }
.card-inner { display: block; position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.75s cubic-bezier(0.2, 0.7, 0.2, 1); }
.card.is-open .card-inner { transform: rotateY(180deg); }
.side {
  position: absolute; inset: 0; display: block; overflow: hidden; border-radius: 6.5% / 3.8%;
  backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 10px 28px var(--shadow), 0 0 0 1px rgba(212, 178, 106, 0.18);
}
.side svg, .side img { display: block; width: 100%; height: 100%; object-fit: cover; }
.face { transform: rotateY(180deg); }
.card.is-rev .face { transform: rotateY(180deg) rotateZ(180deg); }
.hint { margin: 0; color: var(--muted); font-size: 0.9rem; text-align: center; }
.streak { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.moons { display: flex; gap: 10px; }
.moons i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--gilt-deep); background: transparent; transition: background 0.6s, box-shadow 0.6s; }
.moons i.on { background: var(--gilt); border-color: var(--gilt); box-shadow: 0 0 10px var(--gilt-glow); }
.streak-text { margin: 0; font-size: 0.8rem; letter-spacing: 0.08em; color: var(--muted); }

/* カードの絵 */
.paper { fill: var(--paper); }
.back { fill: var(--back); }
.ln { fill: none; stroke: var(--card-ink); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.gd { fill: none; stroke: var(--gilt-deep); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.hair { fill: none; stroke: var(--gilt-deep); stroke-width: 0.5; }
.gf { fill: var(--gilt-deep); stroke: none; }
.kf { fill: var(--card-ink); stroke: none; }
.bk-line { fill: none; stroke: var(--gilt); stroke-width: 1.2; }
.bk-hair { fill: none; stroke: var(--gilt); stroke-width: 0.5; stroke-opacity: 0.5; }
.bk-fill { fill: var(--gilt); stroke: none; }
.t-num { font-family: var(--font-latin); font-size: 13px; letter-spacing: 1.5px; fill: var(--card-ink); }
.t-jp { font-family: var(--font-display); font-size: 15px; font-weight: 600; fill: var(--card-ink); }
.t-en { font-family: var(--font-latin); font-size: 6.2px; letter-spacing: 1px; fill: var(--card-ink-soft); }

/* ボタン */
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
.btn {
  font: inherit; font-size: 0.95rem; color: var(--ink); background: transparent; cursor: pointer;
  border: 1px solid var(--gilt-deep); border-radius: 4px; padding: 9px 20px; letter-spacing: 0.06em;
}
.btn:hover { border-color: var(--gilt); }
.btn:focus-visible { outline: 2px solid var(--gilt); outline-offset: 3px; }
.btn-primary { background: var(--gilt); border-color: var(--gilt); color: var(--cloth-deep); font-weight: 600; }
.toast { font-size: 0.85rem; color: var(--verdigris); }

/* 読み解き */
.reading { display: flex; flex-direction: column; gap: 18px; }
.entry {
  position: relative; display: flex; flex-direction: column; gap: 6px; padding: 24px 26px 22px; min-width: 0;
  background: linear-gradient(180deg, #1a1322, #120d18); border: 1px solid var(--gilt-deep); border-radius: 6px;
  box-shadow: 0 10px 30px var(--shadow); animation: rise 0.5s ease backwards;
}
.entry::before { content: ""; position: absolute; inset: 5px; border: 1px solid rgba(212, 178, 106, 0.28); border-radius: 3px; pointer-events: none; }
.entry::after {
  content: "\2726"; position: absolute; top: -0.65em; left: 50%; transform: translateX(-50%); padding-inline: 10px;
  background: var(--cloth); color: var(--gilt); font-size: 0.8rem; line-height: 1;
}
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
.entry-pos { margin: 0; font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.28em; color: var(--gilt); }
.entry h2 { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-family: var(--font-display); font-weight: 600; font-size: 2rem; line-height: 1.3; letter-spacing: 0.08em; }
.entry .num { font-family: var(--font-latin); font-weight: 400; font-size: 1.1rem; color: var(--gilt); letter-spacing: 0.12em; }
.chip { font-family: var(--font-body); font-weight: 400; font-size: 0.72rem; letter-spacing: 0.08em; padding: 1px 9px; border: 1px solid var(--gilt); color: var(--gilt); border-radius: 999px; }
.chip.rev { border-color: var(--verdigris); color: var(--verdigris); }
.kw { margin: 0; font-size: 0.85rem; color: var(--muted); letter-spacing: 0.06em; }
.msg { margin: 8px 0 0; max-width: 32em; padding-top: 10px; border-top: 1px solid var(--rule); }
#copy-fallback {
  width: 100%; min-height: 9rem; font: inherit; font-size: 0.85rem; color: var(--ink);
  background: var(--cloth-deep); border: 1px solid var(--rule); border-radius: 4px; padding: 10px;
}

/* 今日のひとこと */
.today { text-align: center; display: flex; flex-direction: column; gap: 6px; padding: 18px 16px 16px; border-top: 1px solid var(--gilt-deep); border-bottom: 1px solid var(--gilt-deep); animation: rise 0.6s ease backwards; }
.today-label { margin: 0; font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.3em; color: var(--gilt); }
.today-word { margin: 0; font-family: var(--font-display); font-size: 1.7rem; font-weight: 600; letter-spacing: 0.12em; line-height: 1.4; text-shadow: 0 0 20px var(--gilt-glow); }
.lucky { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 22px; font-size: 0.85rem; color: var(--muted); }
.lucky b { font-weight: 600; color: var(--ink); }
.lucky-color i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; border: 1px solid rgba(255,255,255,0.25); }

/* カード一覧 */
.index { border-top: 1px solid var(--rule); padding-top: 14px; }
.index summary { cursor: pointer; font-family: var(--font-display); letter-spacing: 0.08em; color: var(--gilt); padding-block: 4px; }
.index summary:focus-visible { outline: 2px solid var(--gilt); outline-offset: 3px; }
.index ul { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.index li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 14px; align-items: center; }
.index li.index-head { display: block; margin-top: 12px; padding-bottom: 4px; border-bottom: 1px solid var(--rule); font-family: var(--font-display); font-size: 0.9rem; letter-spacing: 0.2em; color: var(--gilt); }
.index li.index-head:first-child { margin-top: 0; }
.index .thumb { border-radius: 4px; overflow: hidden; aspect-ratio: 140 / 240; box-shadow: 0 3px 8px var(--shadow); }
.index .thumb svg, .index .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.index h3 { margin: 0; font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
.index h3 span { font-family: var(--font-latin); font-weight: 400; font-size: 0.85rem; color: var(--muted); }
.index p { margin: 0; font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
.index b { font-weight: 400; color: var(--gilt); margin-right: 6px; }
.index b.rev { color: var(--verdigris); }

/* ホーム画面への追加案内 */
.install { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; font-size: 0.85rem; color: var(--muted); line-height: 1.6; }
.install p { margin: 0; flex: 1; min-width: 0; }
.install button { font: inherit; color: var(--gilt); background: none; border: 0; padding: 0; cursor: pointer; white-space: nowrap; }
.install button:focus-visible { outline: 2px solid var(--gilt); outline-offset: 3px; }
footer { text-align: center; font-size: 0.75rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .slot, .entry { animation: none; }
  .card-inner { transition: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <p class="eyebrow">TAROT · LXXVIII</p>
    <h1>月読</h1>
    <p class="mast-rule">TSUKUYOMI</p>
    <p class="lede">知りたいことを思い浮かべて、カードをめくってください。</p>
  </header>

  <form class="setup" id="setup">
    <div class="seg" role="radiogroup" aria-label="引き方">
      <input type="radio" name="spread" id="spread-one" value="one">
      <label for="spread-one">1枚引き</label>
      <input type="radio" name="spread" id="spread-three" value="three" checked>
      <label for="spread-three">3枚引き</label>
      <input type="radio" name="spread" id="spread-pair" value="pair">
      <label for="spread-pair">相性</label>
    </div>
    <div class="field" id="partner-field" hidden>
      <label for="partner">相手の名前（任意・この端末にだけ保存）</label>
      <input id="partner" type="text" maxlength="20" autocomplete="off" placeholder="例：Aくん">
    </div>
    <div class="field">
      <label for="question">占いたいこと（任意）</label>
      <input id="question" type="text" maxlength="60" autocomplete="off" placeholder="例：あの人に話しかけてもいい？">
    </div>
    <div class="cats" role="radiogroup" aria-label="占いたいことの種類">
      <span class="cat"><input type="radio" name="category" id="cat-love" value="love"><label for="cat-love">恋</label></span>
      <span class="cat"><input type="radio" name="category" id="cat-friend" value="friend"><label for="cat-friend">友だち</label></span>
      <span class="cat"><input type="radio" name="category" id="cat-study" value="study"><label for="cat-study">勉強・部活</label></span>
      <span class="cat"><input type="radio" name="category" id="cat-oshi" value="oshi"><label for="cat-oshi">推し活</label></span>
      <span class="cat"><input type="radio" name="category" id="cat-self" value="self" checked><label for="cat-self">わたし</label></span>
    </div>
    <div class="checks">
    <label class="check" for="allow-rev"><input type="checkbox" id="allow-rev" checked>逆位置を含める</label>
    <label class="check" for="allow-minor"><input type="checkbox" id="allow-minor" checked>小アルカナを含める（78枚）</label>
  </div>
  </form>

  <section class="spread-area" aria-label="引いたカード">
    <ol class="spread three" id="spread"></ol>
    <p class="hint" id="hint" role="status"></p>
    <div class="streak" id="streak" hidden aria-label="連続記録">
      <div class="moons" id="moons"></div>
      <p class="streak-text" id="streak-text"></p>
    </div>
    <div class="actions">
      <button class="btn" id="redeal" type="button">シャッフルして引き直す</button>
    </div>
  </section>

  <section class="reading" id="reading" aria-label="カードの意味" aria-live="polite"></section>
  <dialog class="zoom" id="zoom" aria-label="カードの拡大表示"><div class="zoom-body" id="zoom-body"></div></dialog>

  <section class="today" id="today" hidden aria-label="今日のひとこと">
    <p class="today-label">今日のひとこと</p>
    <p class="today-word" id="today-word"></p>
    <div class="lucky">
      <span class="lucky-color"><i id="lucky-swatch"></i>ラッキーカラー <b id="lucky-color"></b></span>
      <span>ラッキーアイテム <b id="lucky-item"></b></span>
    </div>
  </section>
  <div class="actions" id="share" hidden>
    <button class="btn btn-primary" id="share-image" type="button">画像でシェア</button>
    <button class="btn" id="copy" type="button">結果をコピー</button>
    <span class="toast" id="toast" role="status"></span>
  </div>
  <textarea id="copy-fallback" aria-label="占いの結果" readonly hidden></textarea>

  <details class="index">
    <summary>78枚のカードと意味</summary>
    <ul id="index-list"></ul>
  </details>

  <aside class="install" id="install" hidden>
    <p>ホーム画面に追加すると、通信がなくてもアプリとして使えます。iPhoneでは、Safariの共有ボタンから「ホーム画面に追加」を選びます。</p>
    <button id="install-close" type="button">閉じる</button>
  </aside>

  <footer>占いの結果は、娯楽としてお楽しみください。</footer>
</div>

<script>const READINGS = {};</script>
<script src="readings/love.js"></script>
<script src="readings/friend.js"></script>
<script src="readings/study.js"></script>
<script src="readings/oshi.js"></script>
<script src="readings/self.js"></script>
<script src="readings/extra.js"></script>
<script>
"use strict";

/* ===== 設定：自作のカード画像を使う場合 =====
   cards フォルダに 00.jpg〜77.jpg（縦長、比率 7:12 前後）を置き、
   下の CARD_IMAGES を true に変えると、内蔵の図柄の代わりに画像を表示します。 */
const CARD_IMAGES = true;
const cardImagePath = i => `cards/${String(i).padStart(2, "0")}.jpg`;

/* ===== 大アルカナ22枚 ===== */
const MAJOR = [
  { num: "0", jp: "愚者", en: "The Fool",
    up: ["自由", "始まり", "冒険"], upText: "新しい一歩を踏み出すときです。先が見えなくても、身軽さがあなたの味方になります。",
    rev: ["無計画", "軽率", "迷い"], revText: "勢いだけで進むと足元をすくわれそうです。動く前に一度、行き先を確かめましょう。" },

const SPREADS = {
  one: ["今日の一枚"],
  three: ["過去", "現在", "未来"],
  pair: ["あなた", "ふたりの間", "あの人"]
};
const spreadLabels = () => {
  const labels = SPREADS[state.spread].slice();
  if (state.spread === "pair") {
    const name = $("partner").value.trim();
    if (name) labels[2] = name;
  }
  return labels;
};

/* ===== 図柄を描く部品（座標はカード中央を原点とした±40の範囲） ===== */
const P = n => Math.round(n * 100) / 100;
const pts = a => a.map(([x, y]) => `${P(x)},${P(y)}`).join(" ");
const ln = (x1, y1, x2, y2, c = "ln") => `<line class="${c}" x1="${P(x1)}" y1="${P(y1)}" x2="${P(x2)}" y2="${P(y2)}"/>`;
const ci = (cx, cy, r, c = "ln") => `<circle class="${c}" cx="${cx}" cy="${cy}" r="${r}"/>`;
const pg = (a, c = "ln") => `<polygon class="${c}" points="${pts(a)}"/>`;
const pl = (a, c = "ln") => `<polyline class="${c}" points="${pts(a)}"/>`;
const pa = (d, c = "ln") => `<path class="${c}" d="${d}"/>`;
const rc = (x, y, w, h, c = "ln") => `<rect class="${c}" x="${x}" y="${y}" width="${w}" height="${h}"/>`;
const polar = (r, deg, cx = 0, cy = 0) => { const a = deg * Math.PI / 180; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; };
const starPts = (n, R, r, cx = 0, cy = 0, rot = -90) =>
  Array.from({ length: n * 2 }, (_, k) => polar(k % 2 ? r : R, rot + k * 180 / n, cx, cy));
const rays = (n, r1, r2, cx = 0, cy = 0, c = "gd", shortBy = 0) =>
  Array.from({ length: n }, (_, k) => {
    const deg = k * 360 / n - 90;
    const [x1, y1] = polar(r1, deg, cx, cy);
    const [x2, y2] = polar(k % 2 ? r2 - shortBy : r2, deg, cx, cy);
    return ln(x1, y1, x2, y2, c);
  }).join("");
const crescent = (cx, cy, R, c = "gf") =>
  pa(`M${cx} ${cy - R}A${R} ${R} 0 1 0 ${cx} ${cy + R}A${P(R * 1.4)} ${P(R * 1.4)} 0 0 1 ${cx} ${cy - R}Z`, c);
const lemniscate = (cy, w = 28, h = 14, c = "gd") =>
  pa(`M0 ${cy}C${P(w * 0.36)} ${cy - h} ${w} ${cy - h} ${w} ${cy}S${P(w * 0.36)} ${cy + h} 0 ${cy}S${-w} ${cy - h} ${-w} ${cy}S${P(-w * 0.36)} ${cy + h} 0 ${cy}`, c);
const scalePan = x => pl([[x - 10, 6], [x, -20], [x + 10, 6]]) + pa(`M${x - 12} 6A12 12 0 0 0 ${x + 12} 6Z`, "gd");

  /* XIV 節制：二つの杯と流れ */
  () => pg([[-36, -28], [-14, -28], [-20, -6], [-30, -6]]) + pg([[14, 8], [36, 8], [30, 30], [20, 30]])
      + pa("M-17 -18C2 -18 10 -6 20 6", "gd") + pa("M-19 -10C-4 -10 6 0 14 8", "gd") + pa("M-15 -26C8 -26 20 -12 30 6", "gd"),
  /* XV 悪魔：逆さの五芒星 */
  () => ci(0, 0, 32) + pg([0, 2, 4, 1, 3].map(k => polar(32, 90 + 72 * k))) + ci(0, 0, 3, "gf"),
  /* XVI 塔：稲妻 */
  () => pg([[-13, 34], [-10, -12], [10, -12], [13, 34]]) + rc(-14, -24, 28, 12) + rc(-3, -2, 6, 10, "kf") + rc(-3, 18, 6, 10, "kf")
      + pl([[38, -40], [22, -27], [30, -23], [15, -15]], "gd") + ci(-26, -8, 2.5, "gf") + ci(-31, 12, 2.5, "gf") + ci(28, 8, 2.5, "gf"),
  /* XVII 星：大きな星と七つの小さな星 */
  () => pg(starPts(8, 21, 8, 0, -2), "gf")
      + Array.from({ length: 7 }, (_, k) => { const [x, y] = polar(34, k * 360 / 7 - 90, 0, -2); return pg(starPts(4, 5, 2, x, y), "kf"); }).join(""),
  /* XVIII 月：三日月としずく */
  () => crescent(15, -8, 24) + pg(starPts(4, 5, 2, 22, -18), "kf") + pg(starPts(4, 4, 1.6, 27, 2), "kf")
      + ci(-12, 28, 2.5, "kf") + ci(2, 33, 2.5, "kf") + ci(16, 28, 2.5, "kf"),
  /* XIX 太陽 */
  () => ci(0, 0, 13, "gf") + ci(0, 0, 18) + rays(16, 22, 36, 0, 0, "ln", 8),
  /* XX 審判：ラッパと旗 */
  () => pg([[-34, 24], [14, -28], [30, -12]]) + rc(-6, 14, 20, 20) + ln(4, 18, 4, 30, "gd") + ln(-2, 24, 10, 24, "gd")
      + ln(27, -29, 35, -37, "gd") + ln(33, -21, 41, -24, "gd") + ln(19, -34, 22, -42, "gd"),
  /* XXI 世界：花輪と四隅のしるし */
  () => `<ellipse class="ln" cx="0" cy="0" rx="22" ry="34"/><ellipse class="gd" cx="0" cy="0" rx="17" ry="29"/>`
      + pg(starPts(4, 9, 3.5), "gf") + ci(-33, -32, 3, "kf") + ci(33, -32, 3, "kf") + ci(-33, 32, 3, "kf") + ci(33, 32, 3, "kf")
];

const suitEmblem = c => `<circle class="gd" cx="0" cy="0" r="30"/><text class="t-jp" x="0" y="7" text-anchor="middle" font-size="20">${SUIT_NAMES[c.suit].slice(-2, -1)}</text>`;
function faceSVG(i) {
  const c = CARDS[i];
  return `<svg viewBox="0 0 140 240" role="img" aria-label="${c.jp}">
<rect class="paper" x="0" y="0" width="140" height="240"/>
<rect class="gd" x="7" y="7" width="126" height="226" rx="5"/>
<rect class="hair" x="11" y="11" width="118" height="218" rx="3"/>
<text class="t-num" x="70" y="35" text-anchor="middle">${c.num}</text>
<g transform="translate(70 106) scale(1.12)">${EMBLEMS[i] ? EMBLEMS[i]() : suitEmblem(c)}</g>
<line class="gd" x1="38" y1="174" x2="102" y2="174"/>
<text class="t-jp" x="70" y="197" text-anchor="middle">${c.jp}</text>
<text class="t-en" x="70" y="213" text-anchor="middle">${c.en.toUpperCase()}</text>
</svg>`;
}

function backSVG() {
  const x0 = 7, x1 = 133, y0 = 7, y1 = 233, step = 14;
  let lattice = "";
  for (let c = x0 + y0 + step; c < x1 + y1; c += step) {
    const a = Math.max(x0, c - y1), b = Math.min(x1, c - y0);
    if (a < b) lattice += ln(a, c - a, b, c - b, "bk-hair");
  }
  for (let c = x0 - y1 + step; c < x1 - y0; c += step) {
    const a = Math.max(x0, c + y0), b = Math.min(x1, c + y1);
    if (a < b) lattice += ln(a, a - c, b, b - c, "bk-hair");
  }
  return `<svg viewBox="0 0 140 240" aria-hidden="true">
<rect class="back" x="0" y="0" width="140" height="240"/>
${lattice}
<rect class="bk-line" x="7" y="7" width="126" height="226" rx="5"/>
<circle class="back" cx="70" cy="120" r="30"/>
<circle class="bk-line" cx="70" cy="120" r="30"/>
<circle class="bk-hair" cx="70" cy="120" r="25"/>
${pg(starPts(8, 19, 7.5, 70, 120), "bk-fill")}
</svg>`;
}

const faceHTML = i => CARD_IMAGES ? `<img src="${cardImagePath(i)}" alt="${CARDS[i].jp}">` : faceSVG(i);
const backHTML = () => CARD_IMAGES ? `<img src="cards/back.jpg" alt="" aria-hidden="true">` : backSVG();

/* ===== 連続記録（今日の一枚をめくった日を端末に保存） ===== */
function loadDays() { try { return JSON.parse(localStorage.getItem("days") || "[]"); } catch (e) { return []; } }
function markToday() {
  const days = loadDays(); const t = todayKey();
  if (!days.includes(t)) { days.push(t); try { localStorage.setItem("days", JSON.stringify(days.slice(-400))); } catch (e) {} }
}
function streakCount() {
  const set = new Set(loadDays());
  const d = new Date(); let n = 0;
  const key = x => `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
  if (!set.has(key(d))) d.setDate(d.getDate() - 1);
  while (set.has(key(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderStreak() {
  const box = $("streak");
  box.hidden = state.spread !== "one";
  if (box.hidden) return;
  const n = streakCount();
  const lit = n === 0 ? 0 : (n % 7 === 0 ? 7 : n % 7);
  $("moons").innerHTML = Array.from({ length: 7 }, (_, k) => `<i class="${k < lit ? "on" : ""}"></i>`).join("");
  $("streak-text").textContent = n === 0 ? "今日の一枚は毎日かわります。めくると月が満ちていきます。"
    : lit === 7 ? `${n}日連続 ・ 満月です` : `${n}日連続 ・ 満月まであと${7 - lit}日`;
}

/* ===== 占いの進行 ===== */
const $ = id => document.getElementById(id);
const state = { spread: "three", category: "self", drawn: [] };
const readingText = d => {
  const r = READINGS[state.category] && READINGS[state.category][d.i];
  const c = CARDS[d.i];
  return r ? r[d.rev ? 1 : 0] : (d.rev ? c.revText : c.upText);
};

function rand(n) {
  const buf = new Uint32Array(1);
  const limit = Math.floor(0x100000000 / n) * n;
  do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
  return buf[0] % n;
}

/* 日付（YYYY-MM-DD）とそれに基づく乱数。今日の一枚は日付で決まる */
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
function seededRand(seedStr) {
  let h = 2166136261;
  for (const ch of seedStr) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  return n => { h ^= h << 13; h ^= h >>> 17; h ^= h << 5; return (h >>> 0) % n; };
}
function deal() {
  const allowMinor = $("allow-minor").checked;
  const deck = CARDS.map((_, i) => i).filter(i => allowMinor || i < MAJOR.length);
  const allowRev = $("allow-rev").checked;
  const daily = state.spread === "one";
  const r = daily ? seededRand(`tsukuyomi:${todayKey()}:${deck.length}`) : rand;
  for (let k = deck.length - 1; k > 0; k--) {
    const j = r(k + 1);
    [deck[k], deck[j]] = [deck[j], deck[k]];
  }
  state.drawn = deck.slice(0, SPREADS[state.spread].length)
    .map(i => ({ i, rev: allowRev && r(2) === 1, open: false }));
  $("redeal").hidden = daily;
  renderStreak();
  renderSpread();
  renderReading();
}

const orientation = d => d.rev ? "逆位置" : "正位置";

function renderSpread() {
  const labels = spreadLabels();
  const ol = $("spread");
  ol.className = `spread ${state.spread}`;
  ol.innerHTML = state.drawn.map((d, k) => `
    <li class="slot">
      <span class="pos">${labels[k]}</span>
      <button class="card${d.rev ? " is-rev" : ""}" type="button" data-k="${k}" aria-label="${labels[k]}のカードをめくる">
        <span class="card-inner">
          <span class="side">${backHTML()}</span>
          <span class="side face">${faceHTML(d.i)}</span>
        </span>
      </button>
    </li>`).join("");
}

function renderReading() {
  const labels = spreadLabels();
  const opened = state.drawn.filter(d => d.open).length;
  const left = state.drawn.length - opened;
  $("hint").textContent = left === state.drawn.length ? (state.spread === "one" ? "今日のカードをタップしてめくってください。" : "カードをタップしてめくってください。")
    : left > 0 ? `あと${left}枚めくれます。`
    : "すべてのカードをめくりました。";
  $("reading").innerHTML = state.drawn.map((d, k) => {
    if (!d.open) return "";
    const c = CARDS[d.i];
    return `<article class="entry">
      <p class="entry-pos">${labels[k]}</p>
      <h2><span class="num">${c.num}</span>${c.jp}<span class="chip${d.rev ? " rev" : ""}">${orientation(d)}</span></h2>
      <p class="kw">${(d.rev ? c.rev : c.up).join("・")}</p>
      <p class="msg">${readingText(d)}</p>
    </article>`;
  }).join("");
  $("share").hidden = left > 0;
  $("today").hidden = left > 0;
  if (left === 0) {
    const d = state.drawn[state.drawn.length === 3 ? 1 : 0];
    const lucky = luckyOf(d.i);
    $("today-word").textContent = HITOKOTO[d.i];
    $("lucky-color").textContent = lucky.color[0];
    $("lucky-swatch").style.background = lucky.color[1];
    $("lucky-item").textContent = lucky.item;
  }
  $("toast").textContent = "";
  $("copy-fallback").hidden = true;
}

function resultText() {
  const labels = spreadLabels();
  const q = $("question").value.trim();
  const lines = ["月読"];
  if (q) lines.push(`占いたいこと：${q}`);
  state.drawn.forEach((d, k) => {
    const c = CARDS[d.i];
    lines.push("", `【${labels[k]}】${c.num} ${c.jp}（${orientation(d)}）`,
      (d.rev ? c.rev : c.up).join("・"), readingText(d));
  });
  const d = state.drawn[state.drawn.length === 3 ? 1 : 0];
  const lucky = luckyOf(d.i);
  lines.push("", `今日のひとこと：${HITOKOTO[d.i]}`, `ラッキーカラー：${lucky.color[0]}　ラッキーアイテム：${lucky.item}`);
  return lines.join("\n");
}

$("spread").addEventListener("click", e => {
  const btn = e.target.closest(".card");
  if (!btn) return;
  const d = state.drawn[Number(btn.dataset.k)];
  if (d.open) { openZoom(d); return; }
  d.open = true;
  if (state.spread === "one") { markToday(); renderStreak(); }
  btn.classList.add("is-open");
  btn.setAttribute("aria-label", `${CARDS[d.i].jp}（${orientation(d)}）`);
  renderReading();
});

function openZoom(d) {
  const dlg = $("zoom");
  dlg.classList.toggle("is-rev", d.rev);
  $("zoom-body").innerHTML = faceHTML(d.i);
  dlg.setAttribute("aria-label", `${CARDS[d.i].jp}（${orientation(d)}）の拡大表示`);
  dlg.showModal();
}
$("zoom").addEventListener("click", () => $("zoom").close());

$("setup").addEventListener("submit", e => e.preventDefault());
$("setup").addEventListener("change", e => {
  if (e.target.name === "spread") { state.spread = e.target.value; $("partner-field").hidden = state.spread !== "pair"; deal(); }
  if (e.target.name === "category") { state.category = e.target.value; renderReading(); }
  if (e.target.id === "allow-rev" || e.target.id === "allow-minor") deal();
});
$("redeal").addEventListener("click", deal);
$("partner").addEventListener("input", () => {
  try { localStorage.setItem("partner", $("partner").value); } catch (e) {}
  renderSpread(); renderReading();
});
try { $("partner").value = localStorage.getItem("partner") || ""; } catch (e) {}

/* ===== 画像でシェア（縦長 1080×1920） ===== */
const loadImage = src => new Promise((ok, ng) => { const im = new Image(); im.onload = () => ok(im); im.onerror = ng; im.src = src; });
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
async function shareImage() {
  const W = 1080, H = 1920;
  const cv = document.createElement("canvas"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d");
  const g = ctx.createRadialGradient(W / 2, H * 0.3, 100, W / 2, H * 0.5, H * 0.8);
  g.addColorStop(0, "#241b30"); g.addColorStop(0.5, "#15101b"); g.addColorStop(1, "#06040a");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const serif = '"Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif';
  ctx.textAlign = "center"; ctx.fillStyle = "#d4b26a";
  ctx.font = `600 64px ${serif}`; ctx.fillText("月 読", W / 2, 150);
  ctx.font = `28px ${serif}`; ctx.fillText("T S U K U Y O M I", W / 2, 200);
  const main = state.drawn[state.drawn.length === 3 ? 1 : 0];
  const cards = state.drawn.length === 3 ? state.drawn : [main];
  const cw = cards.length === 3 ? 280 : 560, ch = cw * 12 / 7, gap = 30;
  const x0 = (W - (cw * cards.length + gap * (cards.length - 1))) / 2, y0 = 270;
  for (let k = 0; k < cards.length; k++) {
    const d = cards[k], x = x0 + k * (cw + gap);
    ctx.save();
    ctx.shadowColor = "rgba(212,178,106,0.35)"; ctx.shadowBlur = 60;
    roundRect(ctx, x, y0, cw, ch, cw * 0.06); ctx.fillStyle = "#000"; ctx.fill();
    ctx.restore();
    ctx.save(); roundRect(ctx, x, y0, cw, ch, cw * 0.06); ctx.clip();
    if (CARD_IMAGES) {
      try {
        const im = await loadImage(cardImagePath(d.i));
        if (d.rev) { ctx.translate(x + cw / 2, y0 + ch / 2); ctx.rotate(Math.PI); ctx.drawImage(im, -cw / 2, -ch / 2, cw, ch); }
        else ctx.drawImage(im, x, y0, cw, ch);
      } catch (e) { ctx.fillStyle = "#1a1322"; ctx.fillRect(x, y0, cw, ch); }
    } else { ctx.fillStyle = "#1a1322"; ctx.fillRect(x, y0, cw, ch); }
    ctx.restore();
    ctx.fillStyle = "#ece2d0"; ctx.font = `600 ${cards.length === 3 ? 30 : 44}px ${serif}`;
    ctx.fillText(`${CARDS[d.i].jp}`, x + cw / 2, y0 + ch + 56);
    ctx.fillStyle = d.rev ? "#7fc4b5" : "#d4b26a"; ctx.font = `${cards.length === 3 ? 22 : 28}px ${serif}`;
    ctx.fillText(orientation(d), x + cw / 2, y0 + ch + (cards.length === 3 ? 92 : 100));
  }
  let y = y0 + ch + 190;
  ctx.fillStyle = "#d4b26a"; ctx.font = `26px ${serif}`; ctx.fillText("今日のひとこと", W / 2, y);
  ctx.fillStyle = "#ece2d0"; ctx.font = `600 64px ${serif}`; ctx.fillText(HITOKOTO[main.i], W / 2, y + 90);
  const msg = readingText(main); ctx.font = `30px ${serif}`; ctx.fillStyle = "#cfc4b2";
  const lines = []; let cur = "";
  for (const ch2 of msg) { cur += ch2; if (ctx.measureText(cur).width > W - 240) { lines.push(cur); cur = ""; } }
  if (cur) lines.push(cur);
  lines.slice(0, 4).forEach((l, k) => ctx.fillText(l, W / 2, y + 170 + k * 48));
  const lucky = luckyOf(main.i);
  ctx.fillStyle = "#ab9fb8"; ctx.font = `26px ${serif}`;
  ctx.fillText(`ラッキーカラー ${lucky.color[0]}　　ラッキーアイテム ${lucky.item}`, W / 2, y + 170 + Math.min(lines.length, 4) * 48 + 60);
  ctx.fillStyle = "#9d7a3a"; ctx.font = `22px ${serif}`; ctx.fillText("月読 ― タロット占い", W / 2, H - 80);
  const blob = await new Promise(ok => cv.toBlob(ok, "image/png"));
  const file = new File([blob], "tsukuyomi.png", { type: "image/png" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "月読" }); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "tsukuyomi.png"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  $("toast").textContent = "画像を保存しました。";
}
$("share-image").addEventListener("click", () => { shareImage().catch(() => { $("toast").textContent = "画像を作れませんでした。"; }); });

$("copy").addEventListener("click", () => {
  const text = resultText();
  const fallback = () => {
    const ta = $("copy-fallback");
    ta.value = text;
    ta.hidden = false;
    ta.focus();
    ta.select();
    $("toast").textContent = "下の文章を選択してコピーしてください。";
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => { $("toast").textContent = "コピーしました。"; }, fallback);
  } else {
    fallback();
  }
});

/* ===== カード一覧 ===== */
const indexHead = (c, i) => i === 0 ? "大アルカナ" : (c.suit && (i === MAJOR.length || CARDS[i - 1].suit !== c.suit)) ? SUIT_NAMES[c.suit] : "";
$("index-list").innerHTML = CARDS.map((c, i) => `
  ${indexHead(c, i) ? `<li class="index-head">${indexHead(c, i)}</li>` : ""}
  <li>
    <div class="thumb">${faceHTML(i)}</div>
    <div>
      <h3><span>${c.num}</span>${c.jp}</h3>
      <p><b>正位置</b>${c.up.join("・")}</p>
      <p><b class="rev">逆位置</b>${c.rev.join("・")}</p>
    </div>
  </li>`).join("");

/* ===== ホーム画面への追加案内（Webに公開したときだけ表示） ===== */
(function installHint() {
  const isPwaBuild = !!document.querySelector('link[rel="manifest"]') && location.protocol.startsWith("http");
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  let dismissed = false;
  try { dismissed = localStorage.getItem("install-hint") === "closed"; } catch (e) {}
  if (isPwaBuild && !standalone && !dismissed) $("install").hidden = false;
  $("install-close").addEventListener("click", () => {
    $("install").hidden = true;
    try { localStorage.setItem("install-hint", "closed"); } catch (e) {}
  });
})();

document.documentElement.lang = "ja";
if (CARD_IMAGES) CARDS.forEach((_, i) => { new Image().src = cardImagePath(i); });
deal();
</script>

/* Service Worker の登録（http/https で開いたときだけ。ファイルを直接開いた場合は登録しない） */
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
